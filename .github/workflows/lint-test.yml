name: lint-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commit-identity:
    # Every commit is authored by the repository owner and carries no
    # co-author trailer; contributors are people who joined by pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authors and trailers
        run: |
          # The checkout is the synthetic refs/pull/N/merge commit, which GitHub
          # authors with the profile name; check the branch's own commits only.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS=$'\t' read -r sha author; do
            if [[ "$author" != "darklordVirtual" ]]; then
              echo "::error::commit $sha is authored by '$author', not darklordVirtual"; bad=1
            fi
          done < <(git log --format='%H%x09%an' "$base".."$head")
          if git log --format='%B' "$base".."$head" | grep -iE '^(Co-authored-by|Claude-Session):'; then
            echo "::error::a commit carries a co-author or session trailer"; bad=1
          fi
          exit $bad
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the fixture provenance test reads the verifier a sealed
          # set declares it was sealed against out of git (runner.edge_check --check-provenance).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Preflight
        run: ./deploy/scripts/preflight.sh
      - name: Install (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Tests (skips are failures)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q -rs | tee pytest.out
          ! grep -Eq "[0-9]+ (skipped|xfailed|xpassed)" pytest.out
  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the upstream SDK pin
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          pin = json.load(open("upstream/remora.lock.json"))["commit"]
          if not re.fullmatch(r"[0-9a-f]{40}", pin):
              raise SystemExit("upstream SDK pin must be a full commit SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={pin}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: darklordVirtual/REMORA-research
          ref: ${{ steps.upstream.outputs.sha }}
          path: .remora-upstream
          persist-credentials: false
      - name: Install test dependencies (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Test the real pinned SDK (required, no skips)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.remora-upstream:${{ github.workspace }}
          REMORA_PIN: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .remora-upstream rev-parse HEAD)" = "$REMORA_PIN"
          python -m pytest --require-remora-sdk -q -rs tests/sdk | tee pytest-sdk.out
          ! grep -Eq "[0-9]+ (skipped|xfailed|xpassed)" pytest-sdk.out
