# SDD-OT-001 — PR 1 (OT-001 + OT-002) simulator + PR 2 (OT-003 + OT-004) governed boundary.
#
#   ./deploy/scripts/run-demo.sh          # default profile: build, smoke, baseline, evidence
#   docker compose down -v                # tear down
#
# The default profiles (none / `run`) cover the simulator + boundary demo and
# need no REMORA access. The `governed` profile adds PostgreSQL, the protected
# REMORA execution image (deploy/Dockerfile.remora-ot) and the SDK proposing
# runner; it requires access to the pinned REMORA upstream to build, so the
# governed-dispatch claim stays NOT_ESTABLISHED until that image is built.
#
# Networks (SDD §8):
#   observe        read-only measurements; runner/agents live here
#   authority      proposing runner <-> REMORA API, and REMORA <-> PostgreSQL
#   plant-private  actuator listener only; ONLY the twin and the REMORA dispatcher
# All are `internal`: no egress, nothing published to the host.
# Token custody (INV-02): TWIN_ACTUATOR_TOKEN is injected ONLY into `twin`
# (to verify) and `remora` (to present). No runner/agent/contributor service
# receives it or joins plant-private. The actuator listener binds ONLY the twin's
# fixed plant-private address, so it is unreachable from `observe`/`authority`
# even with a guessed URL; auth is enforced independently on top. The control
# listener binds loopback inside the twin.

name: autonomous-ot-control

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0

networks:
  observe:
    internal: true
  authority:
    internal: true
  plant-private:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  twin-state:
  pg-data:
  remora-state:

services:
  twin:
    <<: *hardening
    build:
      context: .
      dockerfile: deploy/Dockerfile.twin
    environment:
      TWIN_READ_BIND: 0.0.0.0
      TWIN_READ_PORT: "8100"
      TWIN_ACTUATOR_BIND: 172.31.250.10
      TWIN_ACTUATOR_PORT: "8200"
      TWIN_CONTROL_BIND: 127.0.0.1
      TWIN_CONTROL_PORT: "8300"
      TWIN_AUTOPLAY_SPEEDUP: ${TWIN_AUTOPLAY_SPEEDUP:-}
      TWIN_READ_TOKEN: ${TWIN_READ_TOKEN:?run deploy/scripts/run-demo.sh to generate .env}
      TWIN_ACTUATOR_TOKEN: ${TWIN_ACTUATOR_TOKEN:?missing}
      TWIN_CONTROL_TOKEN: ${TWIN_CONTROL_TOKEN:?missing}
    volumes:
      - twin-state:/var/lib/twin
    networks:
      observe:
        aliases: [twin]
      plant-private:
        ipv4_address: 172.31.250.10

  runner:
    <<: *hardening
    build:
      context: .
      dockerfile: deploy/Dockerfile.runner
    profiles: [run]
    user: "${OT_UID:-10001}:${OT_GID:-10001}"
    depends_on:
      twin:
        condition: service_healthy
    environment:
      TWIN_READ_URL: http://twin:8100
      TWIN_READ_TOKEN: ${TWIN_READ_TOKEN:?missing}
      TWIN_ACTUATOR_PROBE_URL: http://172.31.250.10:8200
      TWIN_CONTROL_PROBE_URL: http://twin:8300
      OT_GIT_SHA: ${OT_GIT_SHA:-UNKNOWN}
      # Deliberately absent: TWIN_ACTUATOR_TOKEN, TWIN_CONTROL_TOKEN.
    volumes:
      - ./artifacts:/work/artifacts
    networks: [observe]


  # --- governed profile (PR 2, OT-003 + OT-004): REMORA-governed dispatch -----
  # Modeled on the pinned upstream deploy/ot-pilot/docker-compose.yml: REMORA in
  # REMORA_ENV=production with the fail-closed prerequisites bound (durable
  # execution state + envelope store in PostgreSQL, a role-separated token
  # table). Requires access to the pinned REMORA upstream to build; the governed
  # end-to-end effect is NOT_ESTABLISHED until this image is built and run.
  #
  #   ./deploy/scripts/governed-bootstrap.sh    # writes .env dev tokens/keys
  #   docker compose --profile governed up --build -d --wait postgres remora twin
  #   docker compose --profile governed run --rm governed \
  #       runner.governed --setpoint 20.5 --intent-ref WORK-ORDER-001
  #
  # The dev tokens/signing keys below are LOCAL PILOT VALUES (as upstream's are):
  # a real deployment injects them from a secret manager.

  postgres:
    image: postgres:16-alpine
    profiles: [governed]
    environment:
      POSTGRES_DB: ${REMORA_PG_DB:-remora}
      POSTGRES_USER: ${REMORA_PG_USER:-remora}
      POSTGRES_PASSWORD: ${REMORA_PG_PASSWORD:?run deploy/scripts/governed-bootstrap.sh}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-remora} -d $${POSTGRES_DB:-remora}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    networks: [authority]

  remora:
    build:
      context: .
      dockerfile: deploy/Dockerfile.remora-ot
      args:
        REMORA_REPO: ${REMORA_REPO:-https://github.com/darklordVirtual/REMORA-research}
        REMORA_COMMIT: ${REMORA_COMMIT:-2594d08b592e61f3d0f436671a230faaa311db9a}
    profiles: [governed]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      twin:
        condition: service_healthy
    environment:
      REMORA_ENV: production
      REMORA_ENABLED_SURFACES: execution
      # Fail-closed prerequisites: durable execution state + envelope store.
      REMORA_PG_DSN: postgresql://${REMORA_PG_USER:-remora}:${REMORA_PG_PASSWORD}@postgres:5432/${REMORA_PG_DB:-remora}
      REMORA_CONTROL_PLANE_DSN: postgresql://${REMORA_PG_USER:-remora}:${REMORA_PG_PASSWORD}@postgres:5432/${REMORA_PG_DB:-remora}
      # Role-separated token table: operator cannot approve; approver/supervisor
      # (admin) can; viewer is read-only. Each token names its actor for audit.
      REMORA_API_TOKENS: >-
        {"${REMORA_OPERATOR_TOKEN:-ot-agent}":{"tenant":"ot-pilot","role":"operator","actor_id":"ot-agent"},
         "${REMORA_APPROVER_TOKEN:-ot-approver}":{"tenant":"ot-pilot","role":"admin","actor_id":"ot-approver"},
         "${REMORA_SUPERVISOR_TOKEN:-ot-supervisor}":{"tenant":"ot-pilot","role":"admin","actor_id":"ot-supervisor"},
         "${REMORA_VIEWER_TOKEN:-ot-viewer}":{"tenant":"ot-pilot","role":"viewer","actor_id":"ot-viewer"}}
      REMORA_API_BEARER_TOKEN: ${REMORA_OPERATOR_TOKEN:-ot-agent}
      # Signing keys (local pilot values; inject from a vault in reality).
      REMORA_PDP_SIGNING_KEY: ${REMORA_PDP_SIGNING_KEY:-pilot-pdp-key-change-me}
      REMORA_LEASE_SIGNING_KEY: ${REMORA_LEASE_SIGNING_KEY:-pilot-lease-key-change-me}
      REMORA_AUDIT_SIGNING_KEY: ${REMORA_AUDIT_SIGNING_KEY:-pilot-audit-key-change-me}
      REMORA_ENVELOPE_SIGNING_KEY: ${REMORA_ENVELOPE_SIGNING_KEY:-pilot-envelope-key-change-me}
      # Deployment-owned semantics.
      REMORA_TOOL_REGISTRY_MODULE: ot_registry
      REMORA_SEMANTIC_BUNDLE_MODULE: ot_bundle
      REMORA_INTENT_SOURCE_FILE: /app/ot_intents.json
      REMORA_EXECUTION_ARTIFACT_DIR: /var/lib/remora/artifacts
      # OT adapter wiring. Custody: the actuator token is injected ONLY here and
      # in the twin; the dispatcher also reads the twin to bind the revision.
      OT_TWIN_ACTUATOR_URL: http://172.31.250.10:8200
      OT_TWIN_READ_URL: http://twin:8100
      OT_TOOLSPEC_PATH: /app/contracts/ot-toolspec-v1.json
      TWIN_ACTUATOR_TOKEN: ${TWIN_ACTUATOR_TOKEN:?missing}
      TWIN_READ_TOKEN: ${TWIN_READ_TOKEN:?missing}
      PYTHONPATH: /app
    volumes:
      - remora-state:/var/lib/remora
    networks:
      authority:
        aliases: [remora]
      observe: {}
      plant-private:
        ipv4_address: 172.31.250.20

  governed:
    build:
      context: .
      dockerfile: deploy/Dockerfile.governed
      args:
        REMORA_REPO: ${REMORA_REPO:-https://github.com/darklordVirtual/REMORA-research}
        REMORA_COMMIT: ${REMORA_COMMIT:-2594d08b592e61f3d0f436671a230faaa311db9a}
    profiles: [governed]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    user: "${OT_UID:-10001}:${OT_GID:-10001}"
    depends_on:
      remora:
        condition: service_healthy
      twin:
        condition: service_healthy
    environment:
      # Proposing actor: operator SDK token + read token only. No actuator
      # token, not on plant-private (INV-01/INV-02) — zero direct effect.
      REMORA_URL: http://remora:8000
      REMORA_OPERATOR_TOKEN: ${REMORA_OPERATOR_TOKEN:-ot-agent}
      TWIN_READ_URL: http://twin:8100
      TWIN_READ_TOKEN: ${TWIN_READ_TOKEN:?missing}
      OT_GIT_SHA: ${OT_GIT_SHA:-UNKNOWN}
      # Deliberately absent: TWIN_ACTUATOR_TOKEN, TWIN_CONTROL_TOKEN.
    volumes:
      - ./artifacts:/work/artifacts
    networks: [observe, authority]
