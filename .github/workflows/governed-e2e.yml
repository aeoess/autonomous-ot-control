name: governed-e2e
# OT-005: the governed acceptance suite against a freshly built stack
# (pinned REMORA in production mode, PostgreSQL, signed ToolSpec, signed limits).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Known findings recorded as FAIL in the evidence but not failing the job.
      # SDK-01: remora.sdk AuditRef cannot parse a deferred audit ref; fixed
      # upstream in REMORA-research#1099, remove once the pin includes it.
      ALLOW_FAILING: "SDK-01"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Governed acceptance suite
        run: RUN_ID="ci-${{ github.run_id }}-${{ github.run_attempt }}" ./deploy/scripts/run-governed.sh
      - name: Require fresh evidence with zero unexpected outcomes
        run: |
          python3 - <<'PY'
          import json, glob, sys
          m = json.load(open(glob.glob("artifacts/ci-*/manifest.json")[0]))
          c = m["counts"]
          print(json.dumps(c, indent=2))
          # Fresh, non-empty, and every non-PASS is either NOT_RUN or the one
          # allowed known finding; the suite's own exit code already enforced it.
          sys.exit(0 if c["cases"] > 0 and c["passed"] > 0 and c["skipped"] == 0
                   and c["failed"] - c["not_run"] <= 1 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governed-evidence-${{ github.run_id }}
          path: artifacts/
      - if: always()
        run: docker compose -p aoc-governed -f compose.yaml -f compose.governed.yaml down -v || true
