# Federation edge candidates for the A/B/C testbed (ADR-004, SDD §9, D-07).
#
# Source: a read of aeoess/agent-governance-vocabulary#177 on 2026-10-27
# (201 comments). Being listed is NOT consent and NOT an assignment: every
# entry is CANDIDATE_NOT_INVITED until the participant agrees in public, and
# `consent_ref` then links that comment. No participant offered an OT
# artifact; every fit below is our judgement of where their published
# artifact could plug in. Pins are what the thread names; re-check before use.
#
# boundary: authority_fixture | tool_definition | effect_evidence |
#           corpus_adequacy | runner_validity | admission_runtime
# mode:     inline (may only add refusals) | offline (verdicts beside the run)
schema: ot-edge-registry/v1
recommended_first_pair: [corpus-adequacy, federation-port-admission]
