name: federation-edge
# Runs every changed federation edge against the sealed fixtures, sandboxed
# (deploy/scripts/run-edge.sh), plus the template as a self-test that the
# fixtures still discriminate. Validates submitted run records and refuses a
# RESULTS.md that differs from them. No secrets, read-only token, forks included.
#
# A run here is operator PRODUCER on a PRODUCER_CONTROLLED host: an external
# edge reaches at most L2_SECOND_IMPLEMENTATION in CI. L3/L4 come from the
# maintainer's own run, submitted as a record (docs/federation/README.md).
on:
  pull_request:
    paths:
      - "federation/**"
      - "runner/edge_check.py"
      - "runner/federation_fixtures.py"
      - "deploy/scripts/run-edge.sh"
      - "contracts/edge-*.json"
      - "contracts/federation-*.json"
      - "docs/federation/RESULTS.md"
      - ".github/workflows/federation-edge.yml"
permissions:
  contents: read
env:
  OPERATOR: PRODUCER
  HOST: PRODUCER_CONTROLLED
jobs:
  edges:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fixture sets verify against their manifests
        run: |
          for m in federation/fixtures/*/manifest.json; do
            python3 -m runner.edge_check --check-fixtures "$(dirname "$m")"
          done
      - name: Derived sets were sealed by the verifier they declare (fetched from git, run, expected verdicts required)
        run: |
          for m in federation/fixtures/*/manifest.json; do
            if python3 -c "import json,sys;sys.exit(0 if 'sealed_against' in json.load(open(sys.argv[1])) else 1)" "$m"; then
              python3 -m runner.edge_check --check-provenance "$(dirname "$m")"
            fi
          done
      - name: Run records validate and RESULTS.md matches them
        run: |
          python3 -m runner.edge_check --check-records
          python3 -m runner.edge_check --check-results
      - name: Which edges changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          edges=$(git diff --name-only "$base"...HEAD -- federation/edges \
                  | awk -F/ 'NF>=3 && $3!="_template"{print $3}' | sort -u | tr '\n' ' ')
          echo "edges=${edges}" >> "$GITHUB_OUTPUT"
          echo "changed edges: ${edges:-none}"
      - name: Template self-test on every fixture set (each set must still catch every seeded fault)
        run: |
          rc=0
          for m in federation/fixtures/*/manifest.json; do
            ./deploy/scripts/run-edge.sh _template "$(basename "$(dirname "$m")")" || rc=1
          done
          exit $rc
      - name: Run changed edges on their agreed fixture sets
        if: steps.changed.outputs.edges != ''
        shell: bash
        env:
          CHANGED_EDGES: ${{ steps.changed.outputs.edges }}
        run: |
          set -euo pipefail
          rc=0
          for e in $CHANGED_EDGES; do
            # Assignment preserves a selector failure; a failed command inside
            # `for ... in $(...)` would silently execute zero cases.
            sets=$(python3 -m runner.edge_check --list-fixture-sets "federation/edges/$e")
            for fixture_set in $sets; do
              ./deploy/scripts/run-edge.sh "$e" "$fixture_set" || rc=1
            done
          done
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: edge-reports-${{ github.run_id }}
          path: artifacts/edges/
