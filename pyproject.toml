[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ot-control"
version = "0.1.0"
description = "Simulation-only digital-twin OT testbed for REMORA-governed setpoint actions (SDD-OT-001)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.22"]

[tool.setuptools.packages.find]
include = ["twin*", "runner*", "adapter*"]

[tool.setuptools.package-data]
twin = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:.*httpx2.*"]
