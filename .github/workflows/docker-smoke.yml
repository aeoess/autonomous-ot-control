name: docker-smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run demo (build, boundary smoke, baseline, evidence)
        run: RUN_ID="ci-${{ github.run_id }}-${{ github.run_attempt }}" ./deploy/scripts/run-demo.sh
      - name: Require fresh evidence
        run: |
          test -f "artifacts/ci-${{ github.run_id }}-${{ github.run_attempt }}-smoke/manifest.json"
          test -f "artifacts/ci-${{ github.run_id }}-${{ github.run_attempt }}-baseline/manifest.json"
          python3 - <<'PY'
          import json, glob, sys
          m = json.load(open(glob.glob("artifacts/ci-*-smoke/manifest.json")[0]))
          c = m["counts"]
          sys.exit(0 if c["cases"] > 0 and c["failed"] == 0 and c["skipped"] == 0 else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: artifacts/
      - if: always()
        run: docker compose down -v
